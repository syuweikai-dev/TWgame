<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>桌遊計分器</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    font-family:"Arial",sans-serif;
    transition:.3s;
    background:#F8F8F8;
}

.score-container{
    display:flex;
    align-items:center;
    gap:20px;
}

.score{
    min-width:220px;
    text-align:center;
    font-size:120px;
    font-weight:bold;
    user-select:none;
}

.main-btn{
    width:90px;
    height:90px;
    border:none;
    border-radius:20px;
    font-size:50px;
    cursor:pointer;
    background:white;
    box-shadow:0 3px 10px rgba(0,0,0,.15);
}

.controls{
    margin-top:30px;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
}

.reset-btn{
    border:none;
    padding:12px 25px;
    border-radius:12px;
    font-size:18px;
    cursor:pointer;
    background:white;
    box-shadow:0 3px 10px rgba(0,0,0,.15);
}

.color-btn{
    width:45px;
    height:45px;
    border:none;
    border-radius:50%;
    cursor:pointer;
    box-shadow:0 2px 6px rgba(0,0,0,.2);
}

.red{background:#E8B4B8;}
.blue{background:#B8D4F0;}
.green{background:#BFDCC2;}
.yellow{background:#F4E6B5;}
.gray{background:#D5D5D5;}
.white{background:#F8F8F8;}

@media(max-width:600px){

    .score{
        font-size:100px;
        min-width:180px;
    }

    .main-btn{
        width:75px;
        height:75px;
    }

}
</style>
</head>

<body>

<div class="score-container">

    <button class="main-btn" id="minusBtn">−</button>

    <div class="score" id="score">0</div>

    <button class="main-btn" id="plusBtn">+</button>

</div>

<div class="controls">

    <button class="reset-btn" onclick="resetScore()">重置</button>

</div>

<div class="controls">

    <button class="color-btn red" onclick="setColor('#E8B4B8')"></button>
    <button class="color-btn blue" onclick="setColor('#B8D4F0')"></button>
    <button class="color-btn green" onclick="setColor('#BFDCC2')"></button>
    <button class="color-btn yellow" onclick="setColor('#F4E6B5')"></button>
    <button class="color-btn gray" onclick="setColor('#D5D5D5')"></button>
    <button class="color-btn white" onclick="setColor('#F8F8F8')"></button>

</div>

<script>

let score = parseInt(localStorage.getItem("score")) || 0;

const scoreEl = document.getElementById("score");

function updateScore(){
    scoreEl.textContent = score;

    localStorage.setItem(
        "score",
        score
    );
}

function changeScore(amount){
    score += amount;
    
    // 限制分數最低為 0，不得為負數
    if(score < 0){
        score = 0;
    }

    updateScore();
}

function resetScore(){
    score = 0;
    updateScore();
}

function setColor(color){
    document.body.style.backgroundColor = color;

    localStorage.setItem(
        "bgColor",
        color
    );
}

updateScore();

const savedColor = localStorage.getItem("bgColor");

if(savedColor){
    setColor(savedColor);
}

const plusBtn = document.getElementById("plusBtn");
const minusBtn = document.getElementById("minusBtn");

// 點擊加分
plusBtn.addEventListener("click", () => {
    changeScore(1);
});

// 點擊減分
minusBtn.addEventListener("click", () => {
    changeScore(-1);
});

</script>

</body>
</html>
