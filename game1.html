<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>桌遊計分器</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    font-family:"Arial",sans-serif;
    background:#F0F2F5;
    padding: 20px 0;
}

/* 多人容器排版 */
.players-wrapper {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
    max-width: 950px;
    padding: 0 15px;
}

.player-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    background: #FFFFFF;
    padding: 15px;
    border-radius: 20px;
    box-shadow: 0 4px 12px rgba(0,0,0,.08);
    transition: background 0.3s;
}

.player-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    margin-bottom: 8px;
    padding: 0 5px;
}

.player-title {
    font-size: 18px;
    font-weight: bold;
    color: #333;
}

/* 玩家專屬的小顏色選擇器 */
.player-color-picker {
    display: flex;
    gap: 5px;
}

.mini-color-btn {
    width: 22px;
    height: 22px;
    border: 2px solid rgba(0,0,0,0.1);
    border-radius: 50%;
    cursor: pointer;
    transition: transform 0.1s;
}

.mini-color-btn:active {
    transform: scale(0.9);
}

.score-container{
    display:flex;
    align-items:center;
    gap:15px;
}

.score{
    min-width: 140px;
    text-align:center;
    font-size: 70px;
    font-weight:bold;
    user-select:none;
}

.main-btn{
    width: 65px;
    height: 65px;
    border:none;
    border-radius:15px;
    font-size: 35px;
    cursor:pointer;
    background:white;
    box-shadow:0 3px 10px rgba(0,0,0,.15);
}

/* 僅單人時讓字體與按鈕變大 */
.single-mode .score {
    min-width: 220px;
    font-size: 120px;
}
.single-mode .main-btn {
    width: 90px;
    height: 90px;
    font-size: 50px;
}
.single-mode .player-card {
    width: 100%;
    max-width: 450px;
}

.controls{
    margin-top:25px;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    align-items:center;
    gap:15px;
}

.reset-btn{
    border:none;
    padding:10px 20px;
    border-radius:12px;
    font-size:16px;
    cursor:pointer;
    background:white;
    box-shadow:0 3px 10px rgba(0,0,0,.15);
}

/* 下拉選單樣式 */
.player-select {
    padding: 10px 15px;
    border-radius: 12px;
    border: none;
    font-size: 16px;
    cursor: pointer;
    background: white;
    box-shadow: 0 3px 10px rgba(0,0,0,.15);
    outline: none;
}

/* 6種色彩定義 */
.c-red{background:#E8B4B8;}
.c-blue{background:#B8D4F0;}
.c-green{background:#BFDCC2;}
.c-yellow{background:#F4E6B5;}
.c-gray{background:#D5D5D5;}
.c-white{background:#FFFFFF;}

@media(max-width:600px){
    .single-mode .score{
        font-size:100px;
        min-width:180px;
    }
    .single-mode .main-btn{
        width:75px;
        height:75px;
    }
}
</style>
</head>

<body>

<!-- 動態產生成員版面 -->
<div id="appContainer" class="players-wrapper single-mode"></div>

<!-- 控制按鈕區 (重置與人數下拉選單) -->
<div class="controls">
    <button class="reset-btn" onclick="resetAllScores()">全部重置</button>
    
    <select id="playerCountSelect" class="player-select" onchange="changePlayerCount(this.value)">
        <option value="1">單人模式</option>
        <option value="2">2 人對戰</option>
        <option value="3">3 人對戰</option>
        <option value="4">4 人對戰</option>
        <option value="5">5 人對戰</option>
        <option value="6">6 人對戰</option>
    </select>
</div>

<script>
const colors = [
    { name: 'red', hex: '#E8B4B8' },
    { name: 'blue', hex: '#B8D4F0' },
    { name: 'green', hex: '#BFDCC2' },
    { name: 'yellow', hex: '#F4E6B5' },
    { name: 'gray', hex: '#D5D5D5' },
    { name: 'white', hex: '#FFFFFF' }
];

// 讀取儲存的人數，預設為 1
let playerCount = parseInt(localStorage.getItem("playerCount")) || 1;
document.getElementById("playerCountSelect").value = playerCount;

// 讀取各玩家分數與顏色
let scores = [];
let playerColors = [];
for(let i = 0; i < 6; i++) {
    let savedScore = localStorage.getItem("score_p" + i);
    scores.push(savedScore !== null ? parseInt(savedScore) : 0);

    // 預設給每位玩家不同的初始顏色（紅、藍、綠、黃、灰、白）
    let savedColor = localStorage.getItem("color_p" + i);
    playerColors.push(savedColor !== null ? savedColor : colors[i % colors.length].hex);
}

// 建立畫面版面
function renderApp() {
    const container = document.getElementById("appContainer");
    container.innerHTML = "";

    if (playerCount === 1) {
        container.classList.add("single-mode");
    } else {
        container.classList.remove("single-mode");
    }

    for (let i = 0; i < playerCount; i++) {
        let card = document.createElement("div");
        card.className = "player-card";
        card.style.backgroundColor = playerColors[i]; // 套用該玩家自選的卡片背景色
        
        let titleText = playerCount === 1 ? "計分板" : `玩家 ${i + 1}`;
        
        // 產生 6 個小圓點顏色按鈕
        let colorPickerHtml = '';
        colors.forEach(c => {
            colorPickerHtml += `<button class="mini-color-btn" style="background:${c.hex}" onclick="setPlayerColor(${i}, '${c.hex}')"></button>`;
        });

        card.innerHTML = `
            <div class="player-header">
                <div class="player-title">${titleText}</div>
                <div class="player-color-picker">${colorPickerHtml}</div>
            </div>
            <div class="score-container">
                <button class="main-btn" onclick="changeScore(${i}, -1)">−</button>
                <div class="score" id="score_${i}">${scores[i]}</div>
                <button class="main-btn" onclick="changeScore(${i}, 1)">+</button>
            </div>
        `;
        container.appendChild(card);
    }
}

// 改變分數
function changeScore(index, amount) {
    scores[index] += amount;
    if (scores[index] < 0) {
        scores[index] = 0;
    }
    
    const scoreEl = document.getElementById(`score_${index}`);
    if (scoreEl) {
        scoreEl.textContent = scores[index];
    }
    
    localStorage.setItem("score_p" + index, scores[index]);
}

// 設定特定玩家的卡片顏色
function setPlayerColor(index, colorHex) {
    playerColors[index] = colorHex;
    localStorage.setItem("color_p" + index, colorHex);
    renderApp();
}

// 切換人數
function changePlayerCount(count) {
    playerCount = parseInt(count);
    localStorage.setItem("playerCount", playerCount);
    renderApp();
}

// 重置所有分數
function resetAllScores() {
    for (let i = 0; i < 6; i++) {
        scores[i] = 0;
        localStorage.setItem("score_p" + i, 0);
    }
    renderApp();
}

// 初始化載入
renderApp();
</script>

</body>
</html>
